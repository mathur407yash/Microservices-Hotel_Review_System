# Shared defaults for Eureka clients and database-backed services.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

app.security.jwt.issuer=https://hotel-review-system
app.security.jwt.audience=hotel-review-api
app.security.jwt.public-key=${JWT_PUBLIC_KEY}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.ignore-exceptions=io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.circuitbreaker.configs.default.register-health-indicator=false
resilience4j.circuitbreaker.instances.ratingService.base-config=default
resilience4j.circuitbreaker.instances.hotelService.base-config=default

resilience4j.ratelimiter.configs.default.limit-for-period=20
resilience4j.ratelimiter.configs.default.limit-refresh-period=1s
resilience4j.ratelimiter.configs.default.timeout-duration=0
resilience4j.ratelimiter.instances.ratingService.base-config=default
resilience4j.ratelimiter.instances.hotelService.base-config=default
