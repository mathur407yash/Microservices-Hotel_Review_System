server.port=8084

gateway.routes[0].id=user-service
gateway.routes[0].service-id=user-service
gateway.routes[0].paths[0]=/users/**
gateway.routes[0].paths[1]=/adduser

gateway.routes[1].id=hotel-service
gateway.routes[1].service-id=hotel-service
gateway.routes[1].paths[0]=/hotels/**

gateway.routes[2].id=rating-service
gateway.routes[2].service-id=rating-service
gateway.routes[2].paths[0]=/ratings/**

app.security.jwt.private-key=${JWT_PRIVATE_KEY}
app.security.jwt.ttl-seconds=900
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
